<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Coach e atleta</title>
  <desc id="description">Un coach con cappellino e scheda di allenamento guida un atleta che solleva un manubrio. Una curva diagonale divide le due figure.</desc>
