<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cooach Page</title>
    <link href="../style/style.css" rel="stylesheet">
    <script src="../JS/coach.js" defer></script>
    <script src="https://kit.fontawesome.com/f6a32bf7bc.js" crossorigin="anonymous"></script>
</head>
<body>
    <nav class="navbar">
        <ul>
            <li><a href="/public/index.html">Home</a></li>
            <li><a href="/public/explore.html">Esplora</a></li>
            <li><a href="/public/aboutus.html">Chi siamo</a></li>
            <li><a href="/public/witenesses.html">Testimonianze</a></li>
            <li id="profilo"><a href="../private/profile.html"><i class="fas fa-user"></i></a></li>
        </ul>
    </nav>
    <div id="main-div-coach">
        <div id="coach-card-div">
        </div> 
        <div id="overlay" class="hidden"></div>
        <div id="book-div" class="hidden">
            <p id="close-booking-p" > <span id="close-booking-s"><i class="fas fa-times" ></i></span></p>
            <div class="week">
                <span id="booking-left-arrow"><i class="fas fa-long-arrow-alt-left"></i></span>
                <span id="booking-week"></span>
                <span id="booking-right-arrow"><i class="fas fa-long-arrow-alt-right"></i></span>
            </div>
            <h1 id="booking-day-selector">Seleziona il giorno:</h1>
            <div class="days">
                <span class="hidden" data-day="1">
                    <input type="radio" id="lunedi" name="day" value="1">
                    <label for="lunedi">Lunedì</label>
                </span>

                <span class="hidden" data-day="2">
                    <input type="radio" id="martedi" name="day" value="2">
                    <label for="martedi">Martedì</label>
                </span>

                <span class="hidden" data-day="3">
                    <input type="radio" id="mercoledi" name="day" value="3">
                    <label for="mercoledi">Mercoledì</label>
                </span>

                <span class="hidden" data-day="4">
                    <input type="radio" id="giovedi" name="day" value="4">
                    <label for="giovedi"> Giovedì</label>
                </span>

                <span class="hidden" data-day="5">
                    <input type="radio" id="venerdi" name="day" value="5">
                    <label for="venerdi"> Venerdì</label>
                </span>

                <span class="hidden" data-day="6">
                    <input type="radio" id="sabato" name="day" value="6">
                    <label for="sabato">Sabato</label>
                </span>

                <span class="hidden" data-day="7">
                    <input type="radio" id="domenica" name="day" value="7">
                    <label for="domenica">Domenica</label>
                </span>
            </div>
            <h1>Seleziona l'orario per l'incontro</h1>
            <div class="time-slot-div">
            </div>
        </div>
        <div id="coach-button-div">
            <button type="" class="button-3" id="book-button">Prenota la visita</button> 
        </div>
    </div>
    <footer>
        <div id="socials">
            <a href=""><i class="fa-brands fa-facebook"></i></a>
            <a href=""><i class="fa-brands fa-instagram"></i></a>
            <a href=""><i class="fa-brands fa-tiktok"></i></a>
            <a href=""><i class="fa-brands fa-x-twitter"></i></a>
        </div>
        <div>
            <p>@2026 Web Site name | All rights reserved.</p>
        </div>
        <div id="contacts-and-links">
            <div id="phone-num">
                <p><i class="fa-solid fa-phone"></i>:+(39) 123-4567-890.
            </div>
            <div id="useful-links">
                <a href="/public/login.html">Sign in</a>
                <a href="">About Us</a>
                <a href="">Terms of Service</a>
            </div>
        </div>
    </footer>
</body>
</html>
