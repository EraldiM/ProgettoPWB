        <div id="signin-div">
            <form id="form-signin">
                <div id="signin-form">
                    <h1>Registrati</h1>
                    <div id="signin-form-container">
                        <div id="signin-username-div">
                            <p>Nome utente:</p> 
                            <input type="text" name="" value="" id="username-form" placeholder="Nome utente">
                            <span id="username-info-span"><i class="fas fa-info"></i></span>
                        </div> 
                        <div id="signin-name-div">
                            <p>Nome:</p> 
                            <input type="text" name="" value="" id="name-form" placeholder="Nome">
                        </div>                
                        <div id="signin-lastname-div">
                            <p>Cognome:</p> 
                            <input type="text" name="" value="" id="last-form" placeholder="Cognome">
                        </div>                
                        <div id="signin-sex-div">
                            <p>Sesso:</p>
                            <div id="sex-list-wrapper">
                                <select id= "sex-list">
                                    <option value="" selected disabled>Scegli il tuo sesso</option> 
                                    <option value="maschio">Maschio</option>
                                    <option value="femmina">Femmina</option>
                                </select>
                                <span class="sex-select-icon" aria-hidden="true"><i class="fas fa-chevron-down"></i></span>
                            </div>
                        </div>
                        <div id="signin-password-div">
                            <p>Password:</p> 
                            <input type="password" name="" value="" id="password-form" placeholder="Password">
                        </div>
                        <div id="signin-confirm-password-div">
                            <p>Conferma Password:</p> 
                            <input type="password" name="" value="" id="password-form" placeholder="Password">
                        </div>
                    </div>
                    <div id="signin-button-div">
                        <button type="button" id="signin-button" class="button-3">Registrati</button> 
                    </div>
                </div>
                <div id="user-name-rule-div" class="hidden">
                        
                </div>
